name: Cloak Latest Fingerprint A/B

on:
  pull_request:
    branches: [main]
    paths:
      - 'jobs/cloak-latest-fingerprint/*.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET: 'https://demo.fingerprint.com/web-scraping'
      CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current browsers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'cloakbrowser==0.5.8'
          python -m playwright install-deps chromium
          python -m playwright install chromium
          if [ -n "${CLOAKBROWSER_LICENSE_KEY:-}" ]; then echo 'CLOAK_KEY_PRESENT=true'; else echo 'CLOAK_KEY_PRESENT=false'; fi
          python -m cloakbrowser install
          python -m cloakbrowser info || true

      - name: Run stock vs current Cloak
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ab.py <<'PY'
          import json, os, time
          from playwright.sync_api import sync_playwright
          from cloakbrowser import launch

          target = os.environ['TARGET']
          out = {'target': target, 'key_present': bool(os.environ.get('CLOAKBROWSER_LICENSE_KEY')), 'runs': []}

          def grab(name, page, response, t0):
              body = page.locator('body').inner_text(timeout=15000)
              out['runs'].append({
                  'engine': name,
                  'status': response.status if response else None,
                  'title': page.title(),
                  'elapsed_s': round(time.time()-t0, 3),
                  'body_excerpt': body[:5000],
                  'access_denied': 'access denied' in body.lower(),
                  'fingerprint': page.evaluate('''() => ({webdriver:navigator.webdriver, ua:navigator.userAgent, platform:navigator.platform, languages:navigator.languages, plugins:navigator.plugins.length, hardwareConcurrency:navigator.hardwareConcurrency, deviceMemory:navigator.deviceMemory||null})''')
              })

          with sync_playwright() as pw:
              b = pw.chromium.launch(headless=False)
              p = b.new_page(viewport={'width':1365,'height':768})
              t=time.time(); r=p.goto(target, wait_until='domcontentloaded', timeout=60000); time.sleep(8)
              grab('stock_playwright', p, r, t); b.close()

          b = launch(headless=False, humanize=True)
          p = b.new_page()
          t=time.time(); r=p.goto(target, wait_until='domcontentloaded', timeout=60000); time.sleep(8)
          grab('cloak_current', p, r, t); b.close()

          print('RESULT_JSON_START')
          print(json.dumps(out, ensure_ascii=False, indent=2))
          print('RESULT_JSON_END')
          PY
          xvfb-run -a python /tmp/ab.py
