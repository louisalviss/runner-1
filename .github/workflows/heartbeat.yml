name: Runner1 Heartbeat

on:
  issues:
    types: [opened]

jobs:
  ping:
    if: github.event.issue.title == '[runner1-heartbeat]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Persist heartbeat
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          body="runner1 heartbeat run=$RUN_ID at=$(date -u +%FT%TZ)"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          payload="$(printf '{\"message\":\"test: persist runner1 heartbeat [skip ci]\",\"content\":\"%s\"}' "$encoded")"
          curl --fail-with-body -sS -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/contents/diagnostics/heartbeat-${RUN_ID}.txt" \
            -d "$payload"
