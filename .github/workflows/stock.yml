name: Wave Rider Stock Runner 1

on:
  workflow_dispatch:
    inputs:
      m:
        required: false
        default: "8"
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - ".github/workflows/stock.yml"
      - "stock_ci.sh"
      - "stock_runner.py"
      - "stock_runner_entry.py"
      - "requirements.txt"
  schedule:
    - cron: "0 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "45 16 * * 1-5"
    - cron: "45 17 * * 1-5"
    - cron: "45 19 * * 1-5"
    - cron: "45 20 * * 1-5"
    - cron: "15 22 * * 1-5"
    - cron: "15 23 * * 1-5"

concurrency:
  group: wave-rider-stock-runner-1
  cancel-in-progress: false

jobs:
  stock:
    if: github.event_name != 'issues' || github.event.issue.title == '[runner1-stock-probe]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Mark Stock workflow start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          body="stock-workflow-start run=$RUN_ID at=$(date -u +%FT%TZ)"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          payload="$(printf '{\"message\":\"debug: Stock workflow start [skip ci]\",\"content\":\"%s\"}' "$encoded")"
          curl --fail-with-body -sS -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/contents/diagnostics/stock-workflow-${RUN_ID}.txt" \
            -d "$payload"

      - name: Run Stock only on runner-1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_M: ${{ inputs.m }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" work
          cd work
          bash stock_ci.sh
