name: Wave Rider Stock Runner 1

on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  stock:
    if: github.event.issue.title == '[runner1-stock-probe]' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Mark Stock workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          body="stock-minimal run=$RUN_ID at=$(date -u +%FT%TZ)"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          payload="$(printf '{\"message\":\"debug: minimal Stock workflow [skip ci]\",\"content\":\"%s\"}' "$encoded")"
          curl --fail-with-body -sS -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/contents/diagnostics/stock-minimal-${RUN_ID}.txt" \
            -d "$payload"
