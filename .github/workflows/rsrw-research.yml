name: Wave Rider RS-RW Research

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rsrw-research.yml"
      - "research/rsrw_backtest.py"
      - "research/rsrw_backtest_vision.py"
      - "research/rsrw_trigger.txt"
  pull_request:
    branches: [main]
    paths:
      - "research/rsrw_trigger.txt"
      - "research/rsrw_backtest.py"
      - "research/rsrw_backtest_vision.py"

concurrency:
  group: wave-rider-rsrw-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run parity-checked RS/RW A-B
        run: python research/rsrw_backtest_vision.py
      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: rsrw-result
          path: research/rsrw_result.json
          if-no-files-found: error
          retention-days: 1
      - name: Persist result on push runs only
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "wave-rider-research[bot]"
          git config user.email "wave-rider-research[bot]@users.noreply.github.com"
          git add research/rsrw_result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: RS-RW preliminary result [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
