name: FB Portability Runtime Canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fb-portability-runtime-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runtime canary
        shell: bash
        run: |
          set -euo pipefail
          t0=$(date +%s%3N)
          mkdir -p /tmp/fb-canary/profile
          dd if=/dev/zero of=/tmp/fb-canary/profile/dummy.bin bs=1M count=10 status=none
          tar -C /tmp/fb-canary -czf /tmp/fb-capsule.tar.gz profile
          rm -rf /tmp/fb-canary/profile
          mkdir -p /tmp/fb-restore
          tar -C /tmp/fb-restore -xzf /tmp/fb-capsule.tar.gz
          t1=$(date +%s%3N)
          direct_ip=$(curl -fsS --max-time 10 https://api.ipify.org)
          echo "runner_os=$RUNNER_OS"
          echo "direct_ip=$direct_ip"
          echo "capsule_bytes=$(stat -c%s /tmp/fb-capsule.tar.gz)"
          echo "pack_restore_ms=$((t1-t0))"
          echo "fb_runtime_canary=PASS"
