name: x
on:
  workflow_dispatch:
    inputs:
      m:
        required: false
        default: "8"
  schedule:
    - cron: "0 14,15 * * 1-5"
    - cron: "45 16,17 * * 1-5"
    - cron: "45 19,20 * * 1-5"
    - cron: "15 22 * * 1-5"
  push:
    branches: [main]
    paths: [".github/workflows/x.yml"]
concurrency:
  group: x
  cancel-in-progress: false
jobs:
  x:
    if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.m != '9')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          python a.py 7 >/tmp/r
          pip install --no-input -r /tmp/r
      - shell: bash
        env:
          M: ${{ github.event_name == 'schedule' && '0' || inputs.m }}
        run: |
          set +e
          python a.py "$M"
          x=$?
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A o 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m ". [skip ci]" && git push; fi
          exit "$x"
  c:
    if: github.event_name == 'push' && github.event.head_commit.message == 'c'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - shell: bash
        env:
          T: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan z
          git add -A
          git commit -m "."
          git branch -M main
          git push --force origin main
          sleep 5
          curl -fsSL -X POST -H "Authorization: Bearer ${T}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/x.yml/dispatches" -d '{"ref":"main","inputs":{"m":"9"}}'
  q:
    if: github.event_name == 'workflow_dispatch' && inputs.m == '9'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          T: ${{ github.token }}
        run: |
          ids=$(curl -fsSL -H "Authorization: Bearer ${T}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" | jq -r --arg s "$GITHUB_RUN_ID" '.workflow_runs[]|select(.status=="completed")|select((.id|tostring)!=$s)|.id')
          for id in $ids; do curl -fsSL -X DELETE -H "Authorization: Bearer ${T}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${id}" || true; done
